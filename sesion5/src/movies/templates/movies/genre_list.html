<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Géneros - Cine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #15171c;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(229,9,20,0.08), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(229,9,20,0.08), transparent 40%);
            color: #f2f2f2;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: #1c1f26;
            border-bottom: 3px solid #e50914;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        nav .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #e50914;
            text-decoration: none;
        }

        nav .links {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        nav .links a {
            text-decoration: none;
            color: #f2f2f2;
            font-size: 1.05rem;
            padding: 9px 16px;
            border-radius: 4px;
            transition: 0.2s;
        }

        nav .links a:hover {
            background: rgba(229,9,20,0.15);
        }

        nav .admin-btn {
            background: #e50914;
            color: #fff !important;
            font-weight: 600;
            font-size: 1.1rem;
        }

        nav .admin-btn:hover {
            background: #ff1a25;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 55px 30px;
        }

        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #9a9ca3;
            margin-bottom: 35px;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .genre-card {
            position: relative;
            background: linear-gradient(145deg, #23262e, #1a1c22);
            border: 1px solid #2d3038;
            border-radius: 10px;
            padding: 30px 20px;
            text-decoration: none;
            color: inherit;
            text-align: center;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .genre-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: #e50914;
        }

        .genre-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(229,9,20,0.25);
            border-color: #e50914;
        }

        .genre-icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .genre-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: #fff;
        }

        .empty {
            color: #9a9ca3;
            font-style: italic;
            padding: 30px 0;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'movies:genre_list' %}" class="brand">🎬 CineHub</a>
        <div class="links">
            <a href="{% url 'movies:genre_list' %}">Géneros</a>
            <a href="/admin/" class="admin-btn">Iniciar sesión como administrador</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Explora por género</h1>
        <p class="subtitle">Descubre las películas mejor valoradas de cada categoría</p>

        <div class="grid">
            {% for genre in genres %}
                <a href="{% url 'movies:genre_recommendations' genre.id %}" class="genre-card">
                    <div class="genre-icon">🎞️</div>
                    <div class="genre-name">{{ genre.name }}</div>
                </a>
            {% empty %}
                <p class="empty">Todavía no hay géneros registrados.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
