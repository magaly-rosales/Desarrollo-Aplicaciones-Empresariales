<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Blog del laboratorio</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 56px;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  h1 {
    max-width: 720px;
    margin: 0 auto 24px;
    font-size: 2rem;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  article {
    max-width: 720px;
    margin: 0 auto 16px;
    padding: 18px 22px;
    background: var(--card);
    border-left: 5px solid var(--accent);
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(31, 41, 55, 0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  article:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(31, 41, 55, 0.14);
  }
  article h2 { margin: 0 0 6px; font-size: 1.2rem; }
  article p { margin: 4px 0; font-size: 0.9rem; color: var(--muted); }
  article span {
    display: inline-block;
    margin: 4px 6px 0 0;
    padding: 2px 10px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  article em { font-size: 0.8rem; color: var(--muted); }
  body > p { max-width: 720px; margin: 0 auto; color: var(--muted); }
</style>
</head>
<body>
  <h1>Artículos publicados</h1>
  {% for post in posts %}
    <article>
      <h2>{{ post.title }}</h2>
      <p>Por {{ post.author.name }} · {{ post.published_at|date:"d/m/Y" }}</p>
      <p>
        {% for tag in post.tags.all %}<span>#{{ tag.name }}</span>{% empty %}<em>sin etiquetas</em>{% endfor %}
      </p>
    </article>
  {% empty %}
    <p>No hay artículos publicados.</p>
  {% endfor %}
</body>
</html>
